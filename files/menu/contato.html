<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Contato</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div id="tudo">
        <!--Cabecalho-->
	    <div id="cabecalho">
	        <h1>Contato</h1>
	        <h3>Entre em contato:</h3>
	    </div>

        <!--Conteudo da pagina-->
        <main class="conteudo">

            <h3>Voce pode me contatar através do formulário de contato:</h3>
            <!-- modify this form HTML and place wherever you want your form -->
            <form
            action="https://formspree.io/f/xoevqkvr"
            method="POST"
            >
            <label>
                Digite seu email:
                <input type="email" name="email">
            </label>
            <label>
                Sua mensagem:
                <textarea name="message"></textarea>
            </label>
            <!-- your other form fields go here -->
            <button type="submit">Enviar</button>
            </form>

            <h3>Ou me envie um email diretamente para <a href="mailto:vinicius@magrin.eco.br">vinicius@magrin.eco.br</a></h3>

        </main>

    </div>
<script src="/js/header.js"></script>
<script src="/js/footer.js"></script>

</html>
